# Scenario definitions with multipliers and overrides.
# Adding a new scenario only requires adding a YAML entry — no Python changes.

scenarios:
  baseline:
    description: "Baseline: wind+solar+storage"
    with_wind: true

  high_re:
    description: "High renewable: 2x PV and wind capacity"
    with_wind: true
    multipliers:
      pv: 2.0
      wind: 2.0

  peak_load:
    description: "Peak load: 1.5x all loads and storage"
    with_wind: true
    multipliers:
      load: 1.5
      storage: 1.5

  congestion:
    description: "Network congestion: line capacity halved"
    with_wind: true
    override_config:
      line_capacity_multiplier: 0.5

  re_ramp_drop:
    description: "RE sudden drop: output falls to 10% at midpoint"
    with_wind: true
    re_ramp:
      type: sudden_drop
      multiplier: 0.1

  re_ramp_surge:
    description: "RE sudden surge: output surges from 10% to full at midpoint"
    with_wind: true
    re_ramp:
      type: sudden_surge
