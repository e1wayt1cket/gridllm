  # buses 15,16,17 are far-end nodes on the longest radial branch — prone to evening congestion
  buses: [6, 13, 15, 17, 29, 31]
  capacity_factor: 4.0
  power_ratio: 0.45
  eta_ch: 0.92
  eta_dis: 0.92
  soc0: 0.5
  soc_min: 0.10
  soc_max: 0.95

