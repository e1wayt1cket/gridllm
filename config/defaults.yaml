      eta_dis: 0.94
      soc0: 0.5
      soc_min: 0.10
      soc_max: 0.95
    bid_value: 720.0
    offer_cost: 300.0
    bus_overrides:
      16:
        storage:
          eta_ch: 0.92
          eta_dis: 0.92
          soc0: 0.5
          soc_max: 0.95
          power_ratio_mult: 1.2
        wind_capacity_scale: 2.5
