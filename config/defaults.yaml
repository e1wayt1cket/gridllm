# Default configuration for agent and network parameters.
# All values previously hardcoded in grid.py are externalized here.

network:
  name: case33bw
  # Ampacity formula: max_i_ka = clip(base_ka / sqrt(R_ohm), min_ka, max_ka)
  # Calibrated to ACSR conductor data (GB/T 1179): k = I * sqrt(R) ≈ 0.18-0.21
  #  base_ka=0.19 matches LGJ-120 (~380A at R=0.23 ohm/km) as the reference.
  #  min_ka=0.08  corresponds to ~80A (smallest practical MV conductor).
  #  max_ka=0.80  corresponds to ~800A (substation busbar / heavy trunk).
  # Before recalibration (2026-07-04), base_ka=0.65 with min_ka=0.25 clipped
  # 17 of 32 lines to the 0.80 ceiling, erasing thermal differentiation.
  base_ampacity_ka: 0.22
  min_line_ka: 0.08
  max_line_ka: 0.80
  ramp_limit_mw_per_period: null  # max MW change per 15-min in net grid exchange, null = disabled
  # Per-line capacity overrides — use to model line upgrades or N-1 relief.
  # Remove or set to {} when the physical ampacity formula provides
  # sufficient headroom (current calibration gives 3-14x margin on all lines).
  line_capacity_overrides: {}

profiles:
  pv:
    amplitude: 1.0
    cloud_prob: 0.15
    cloud_attenuation_min: 0.55
    cloud_attenuation_max: 0.85
    cloud_persistence: 0.85
    cloud_seed: 42
  wind:
    seed: 42
    ar_coef: 0.90
    noise_std: 0.15
    peak_hour: 3.0
  load:
    forecast_noise_sigma: 0.06
    real_noise_sigma: 0.12
    # Dual-Gaussian base template (normalized to mean≈1.0)
    morning_peak_hour: 8.0
    morning_peak_amplitude: 0.40
    morning_peak_width: 2.0
    evening_peak_hour: 19.0
    evening_peak_amplitude: 0.65
    evening_peak_width: 2.5
    night_base: 0.50
    # Per-type phase shift (hours) and amplitude scale
    type_overrides:
      residential:
        phase_shift_hours: 1.0
        amplitude_scale: 1.15
      commercial:
        phase_shift_hours: -2.0
        amplitude_scale: 0.95
      industrial:
        phase_shift_hours: 0.0
        amplitude_scale: 0.55

