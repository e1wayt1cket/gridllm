formal_training:
  experiment_id: FORMAL_NEAR_COMMON_B_C2_GATE
  protocol_version: 6
  accepted_candidate: V6_candidate_001
  dataset: JN-Base-NEAR / common_split near view
  split: data\processed\v2_cy_jn_2025\common_split.json
  split_view: near
  split_seed: 20261101
  reward_mode: B_C2
  gamma: 0.99
  fixed_scale: 100.0
  terminal_soc:
    initial: 0.5
    final: 0.5
    day_end_window_only: true
  cycle_cost_cny_per_mwh: 100.0
  clearing_engine: socp
  network_support: line50_q2.0
  b1_source: b1_terminal_neutral
  settlement: two_settlement_ledger
  observation:
    name: v6_12d
    version: 6
    dimensions: 12
  action:
    name: storage_quote_v4
    version: 4
    quote_map: linear_core_v1
    dimensions_per_unit: 2
    ess_order:
    - ESS9
    - ESS14
    - ESS17
    - ESS27
  gate:
    per_unit: 2
    total: 8
    estimator: straight_through_bernoulli
    temperature_start: 4.0
    temperature_end: 1.0
    warmup_episodes: 106
    evaluation_temperature: 1.0
    logit_bound: 4.0
  networks:
    actor: 256-128-4
    critic: centralized twin 256-256 no dropout
  optimizer:
    name: Adam
    lr: 0.0003
    tau: 0.005
    policy_delay: 2
    batch_size: 128
    buffer_capacity: 6000
    start_steps: 480
    critic_weight_decay: 0.0
    actor_weight_decay: 1.0e-05
    calibration_interval: 8
  anchor:
    weight: 0.1
    form: sum over an agent's legs of squared quotes scaled by each leg's high, averaged
      over the batch
    calibrated_by: reports/algorithm_diagnostics/v4_anchor_calibration.json
    selection_rule: largest weight with zero corner excess over weight 0
    note: not a profit-selected hyperparameter
  hinge:
    advantage_hinge_delta: 0.1
    twin_gap_weight: 1.0
    form: -ReLU(Q(a) - Q(a_truthful) - delta_eff) with delta_eff = clamp(twin_gap_weight
      * |Q1 - Q2|, min=delta)
    calibrated_by: reports/algorithm_diagnostics/v4_hinge_calibration.json
    selection_rule: delta = round_up_0.05(max Q variation over states whose payoff
      range over the three lowest quotes < 0.5 CNY)
    note: not a profit-selected hyperparameter
  sampler:
    uniform_fraction: 0.5
    beta: 0.5
    max_upweight: 5.0
  exploration:
    epsilon_start: 0.2
    epsilon_end: 0.05
    decay_episodes: 159
    charge_scale: 0.5
    high_fraction: 0.5
  target:
    policy_noise: 0.2
    noise_clip: 0.5
  episode:
    blocks: 24
    commit_periods: 4
    lookahead_periods: 16
  budget:
    seeds:
    - 11
    - 23
    minimum_rounds: 10
    exposures_per_day_min: 10
    exposures_per_day_max: 15
    episodes_per_seed_min: 530
    episodes_per_seed_max: 795
    block_steps_per_seed_min: 12720
    block_steps_per_seed_max: 19080
    critic_updates_per_block: 1
    actor_updates_every_blocks: 2
  validation:
    passes: after each full pass over the 53 training days
    metric: mean fleet delta G over the 11 validation days (settlement, not reward)
    best_checkpoint: highest validation mean fleet delta G
    resume_checkpoint: every round
    final_checkpoint: end of budget or early stop
    early_stop_patience: 3
  compatibility:
    supersedes: reports/v2_cy_jn_2025/formal_training_v5
    reward_scale: 'fixed_scale 100 (v4, v5 and v6) vs 1000 (v3): reward and delta-G
      magnitudes are NOT comparable across protocols; compare settlement-side G_policy/G_b1
      in CNY only'
    checkpoints: 'v6 runs refuse to load a checkpoint from any earlier protocol: the
      source hashes are part of the frozen manifest, so an earlier checkpoint does
      not describe the v6 clearing (F4 nodal slack penalties, F6 terminal value under
      a pinned endpoint, the v6 non-finite guards). The B1 baseline moves to the recomputed
      artifact, so a v5 run''s delta G was measured against a different network'
  boundaries:
    train_only_in_replay: true
    validation_not_in_replay: true
    test_evaluated: false
    holiday_evaluated: false
    h2_opened: false
    test_label: LEGACY_SEEN_TEST
    independent_generalisation_claim: false
  claims:
    allowed: formal training on the NEAR80 controlled simulation under the frozen
      protocol
    not_allowed: independent generalisation or blind-test result
    old_g10_status: NO-GO remains for an independent generalisation claim
