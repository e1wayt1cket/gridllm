formal_training:
  experiment_id: FORMAL_LOCAL_DA_V7
  protocol_version: 7
  accepted_candidate: V7_candidate_001
  dataset: 'v3 candidate-day library: Jiangsu 2021-2022 bus load paired with 2025
    day-ahead price dates'
  split: reports\candidate_days_v3_2026-11-17\evidence\split.json
  split_view: v3_candidate_library
  split_seed: 20261117
  trainer: src/train_local_da_v7.py
  trainer_split: local_da_v7
  reward_mode: B_C2
  gamma: 0.99
  fixed_scale: 100.0
  terminal_soc:
    mode: free
    initial: 0.5
    valuation: inventory_value at the day end
  cycle_cost_cny_per_mwh: 100.0
  clearing_engine: exact MIQCP dispatch, fixed-direction conditional pricing
  training_gap_tolerance: 0.01
  training_window_seconds: 300.0
  voltage_band_pu:
  - 0.93
  - 1.07
  reactive_support: declared zero-active shunt asset at buses 17, 31, 32 carried by
    the library day and by every training window
  settlement: local day-ahead settlement ledger
  observation:
    name: v7_12d
    version: 7
    dimensions: 12
  action:
    name: storage_quote_v5
    version: 5
    quote_map: linear_core_v1
    dimensions_per_unit: 4
    quote_order:
    - charge_price
    - charge_quantity
    - discharge_price
    - discharge_quantity
    bounds:
      charge_price:
      - 0.0
      - 150.0
      charge_quantity:
      - 0.0
      - 0.4
      discharge_price:
      - 0.0
      - 300.0
      discharge_quantity:
      - 0.0
      - 0.4
    truthful:
      charge_price: 0.0
      charge_quantity: 0.4
      discharge_price: 0.0
      discharge_quantity: 0.4
    ess_order:
    - ESS9
    - ESS14
    - ESS17
    - ESS27
  gate:
    per_unit: 2
    total: 8
    estimator: straight_through_bernoulli
    temperature_start: 4.0
    temperature_end: 1.0
    warmup_episodes: 106
    evaluation_temperature: 1.0
    logit_bound: 4.0
  networks:
    actor: 256-128-4
    critic: centralized twin 256-256 no dropout
  optimizer:
    name: Adam
    lr: 0.0003
    tau: 0.005
    policy_delay: 2
    batch_size: 128
    buffer_capacity: 6000
    start_steps: 480
    actor_weight_decay: 1.0e-05
    calibration_interval: 8
  anchor:
    weight: 0.05
    form: sum over a unit's quotes of squared box-normalised deviations from truthful,
      averaged over the batch
    calibrated_by: reports/local_da_v7_2026-11-18/audit/summary.json (acceptance_6)
    selection_rule: largest weight whose gradient share stays at or below one half
    note: not a profit-selected hyperparameter
  hinge:
    advantage_hinge_delta: 0.1
    twin_gap_weight: 1.0
  sampler:
    uniform_fraction: 0.5
    beta: 0.5
    max_upweight: 5.0
  exploration:
    epsilon_start: 0.2
    epsilon_end: 0.05
    decay_episodes: 159
    charge_scale: 0.5
    high_fraction: 0.5
  target:
    policy_noise: 0.2
    noise_clip: 0.5
  episode:
    blocks: 24
    commit_periods: 4
    lookahead_periods: 16
    roll_horizon: 20
    probe_block: 11
  budget:
    seeds:
    - 11
    - 23
    minimum_rounds: 10
    exposures_per_day_min: 10
    exposures_per_day_max: 15
    episodes_per_seed_min: 900
    episodes_per_seed_max: 1350
    block_steps_per_seed_min: 21600
    block_steps_per_seed_max: 32400
    critic_updates_per_block: 1
    actor_updates_every_blocks: 2
  wall_clock:
    hours_per_seed_min: 12.0
    hours_per_seed_max: 18.0
    status: recorded for the reader; not a gate
    source: reports/local_da_v7_2026-11-18/RESULTS.md latency table at roll horizon
      20
    hard_block_seconds: 300
    hard_block_note: a block that reaches the solver limit spends it; the projection
      is the typical block rate and does not bound a day whose blocks all bind
  validation:
    passes: after each full pass over the 90 training days
    metric: mean fleet delta G over the 18 validation days (settlement, not reward)
    best_checkpoint: highest validation mean fleet delta G
    resume_checkpoint: every round
    final_checkpoint: end of budget or early stop
    early_stop_patience: 3
  compatibility:
    supersedes: reports/v2_cy_jn_2025/formal_training_v6
    reward_scale: fixed_scale 100, unchanged from v4 to v7
    checkpoints: 'v7 runs refuse to load a checkpoint from any earlier protocol: the
      observation name, the quote box and the clearing market all differ, so an earlier
      checkpoint does not describe a v7 policy'
  boundaries:
    train_only_in_replay: true
    validation_not_in_replay: true
    test_evaluated: false
    holiday_evaluated: false
    h2_opened: true
    h2_use: 'price-date adaptation only: the 40 unpaired 2025 price dates the H2 definition
      enumerates also entered training, so no result supports joint source-load generalisation'
    test_label: LEGACY_SEEN_TEST
    independent_generalisation_claim: false
  claims:
    allowed: limited price-date adaptation on 40 unpaired 2025 price dates with historical
      load scenarios, under this frozen protocol
    not_allowed: a joint source-load generalisation claim or any independent generalisation
      claim
    gap_accepted_payoffs: a training payoff may be read off an incumbent inside training_gap_tolerance
      and is then known only to that gap; no settlement payment and no audit price
      was read off an uncertified incumbent
